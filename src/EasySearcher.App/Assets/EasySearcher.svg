<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>EasySearcher</title>
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="240" y2="240">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0B1F66" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bolt" gradientUnits="userSpaceOnUse" x1="114" y1="78" x2="114" y2="150">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#sheen)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="50.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Glyph shadow -->
  <g transform="translate(0 5)" opacity="0.38" filter="url(#soft)">
    <circle cx="114" cy="114" r="54" fill="none" stroke="#0B1F66" stroke-width="24"/>
    <path d="M158 158L192 192" stroke="#0B1F66" stroke-width="32" stroke-linecap="round"/>
  </g>
  <!-- Magnifier -->
  <circle cx="114" cy="114" r="54" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="24"/>
  <path d="M158 158L192 192" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
  <!-- Bolt -->
  <path d="M124 78L92 120H111L103 150L136 106H117Z" fill="url(#bolt)" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
</svg>
