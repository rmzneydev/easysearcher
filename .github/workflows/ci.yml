# Compila la solucion y corre las pruebas en cada push a main y en cada pull request.
# Las pruebas no necesitan administrador (indices en memoria y pipe con nombre propio).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build EasySearcher.slnx -c Release

      - name: Pruebas
        run: dotnet test tests/EasySearcher.Tests -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
